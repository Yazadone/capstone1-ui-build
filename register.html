<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>meFST | Request Access</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="register">
  <main class="login-bg">
    <div class="login-wrap">
      <div class="login-brand">
        <div class="logo"><span class="logo-mark"></span><span>meFST</span></div>
        <p>Request access to population genomic datasets</p>
      </div>
      <section class="login-card">
        <h2>Request Access</h2>
        <p class="sub">Complete this mock registration form for the class demo.</p>
        <form id="registerForm">
          <div class="form-row form-row-2">
            <div><label>First Name</label><input class="input" required value="Demo"></div>
            <div><label>Last Name</label><input class="input" required value="Researcher"></div>
          </div>
          <br>
          <label>Email</label><input class="input" type="email" required value="researcher@university.edu">
          <br><br>
          <label>Institution</label><input class="input" required value="Temple University">
          <br><br>
          <label>Reason for Access</label><textarea required>Class demo for reviewing population genomic dataset search, access requests, analysis, and exports.</textarea>
          <p class="help">This will not send real data. It only shows the UI workflow.</p>
          <br>
          <button class="btn btn-dark btn-block" type="submit">Submit Request</button>
        </form>
        <div class="login-footer">Already have an account? <a href="index.html">Sign In</a></div>
      </section>
    </div>
  </main>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
