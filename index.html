<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>meFST | Sign In</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="login">
  <main class="login-bg">
    <div class="login-wrap">
      <div class="login-brand">
        <div class="logo"><span class="logo-mark"></span><span>meFST</span></div>
        <p>Population Genomics Database Platform</p>
      </div>

      <section class="login-card">
        <h2>Sign In</h2>
        <p class="sub">Access your population genomics datasets</p>
        <form id="signInForm">
          <label for="email">Email</label>
          <input class="input" id="email" type="email" value="researcher@university.edu" placeholder="researcher@university.edu">
          <br><br>
          <label for="password">Password</label>
          <input class="input" id="password" type="password" placeholder="Enter your password" value="demo">
          <div id="loginError" class="error">Please enter an email and password. This is only a demo login.</div>
          <div class="login-options">
            <div class="checkline"><span class="fake-check"></span><span>Remember me</span></div>
            <a class="link" onclick="showToast('Demo message: password reset link sent')">Forgot password?</a>
          </div>
          <button class="btn btn-dark btn-block" type="submit">Sign In</button>
        </form>
        <div class="login-footer">Don't have an account? <a href="register.html">Request Access</a></div>
      </section>

      <p class="data-sources">Data sources: NCBI GEO • NCBI SRA • ArrayExpress (EBI)</p>
    </div>
  </main>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
